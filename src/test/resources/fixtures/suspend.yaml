vars:
  - id: input_file1
    value: input_file1.txt
  - id: output_file1
  - id: output_file2
actions:
  - id: cp1
    type: execute
    service: cp
    inputs:
      - id: input_file
        var: input_file1
    outputs:
      - id: output_file
        var: output_file1
  - id: modification
    type: suspend
    inputs:
      - id: suspend_input
        var: output_file1
    outputs:
      - var: new_input
  - id: cp2
    type: execute
    service: cp
    inputs:
      - id: input_file
        var: new_input
    outputs:
      - id: output_file
        var: output_file2
