vars:
  - id: input_file1
    value: input_file1.txt
  - id: output_file1
  - id: output_file2
actions:
  - id: cp1
    type: execute
    service: cp
    inputs:
      - id: input_file
        var: input_file1
    outputs:
      - id: output_file
        var: output_file1
  - id: used_suspend
    type: suspend
    inputs:
      - id: suspend_input
        var: output_file1
    outputs:
      - var: output_file2
  - id: unused_suspend1
    type: suspend
    inputs:
      - id: suspend_input
        var: output_file1
    outputs:
      - var: unused_file1
  - id: unused_suspend2
    type: suspend
    inputs:
      - id: suspend_input
        var: output_file1
    outputs:
      - var: unused_file2
  - id: cp2
    type: execute
    service: cp
    inputs:
      - id: input_file
        var: output_file2
    outputs:
      - id: output_file
        var: output_file3

